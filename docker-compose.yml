version: "3.9"

services:
  backend:
    build: ./backend
    container_name: esapiens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - esapiens_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  esapiens_data: